<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bracket Left Gradient -->
    <linearGradient id="bracketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bracket Right Gradient -->
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Hexagon / App Icon Tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.75"/>

  <!-- Inner Tech Ambient Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="36" y1="80" x2="220" y2="80"/>
    <line x1="36" y1="128" x2="220" y2="128"/>
    <line x1="36" y1="176" x2="220" y2="176"/>
    <line x1="80" y1="36" x2="80" y2="220"/>
    <line x1="128" y1="36" x2="128" y2="220"/>
    <line x1="176" y1="36" x2="176" y2="220"/>
  </g>

  <!-- Glowing Aura Backing -->
  <circle cx="128" cy="128" r="54" fill="#0ea5e9" opacity="0.12" filter="url(#glow)"/>

  <!-- Central Emblem: Precision Code Glyphs & Cube Accent -->
  <!-- Left Bracket < -->
  <path d="M82 86 L48 128 L82 170" 
        stroke="url(#bracketLeft)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Right Bracket > -->
  <path d="M174 86 L208 128 L174 170" 
        stroke="url(#bracketRight)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Center Slash / -->
  <line x1="144" y1="72" x2="112" y2="184" 
        stroke="url(#slashGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Micro Accent Nodes (Tech Diamonds) -->
  <circle cx="48" cy="128" r="4" fill="#ffffff"/>
  <circle cx="208" cy="128" r="4" fill="#ffffff"/>
  <circle cx="128" cy="128" r="3.5" fill="#34d399"/>
</svg>
